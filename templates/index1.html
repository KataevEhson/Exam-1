{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">

<div class="div4">
     <a class="a2" href="/authors">Авторы</a>
    <a class="a2" href="/show_books">Книги</a>
    <a class="a2" href="/show_orders">Мои заказы</a>
</div>
 
<form method="post" enctype="multipart/form-data">
     {% csrf_token %}
    <input class="i1" name="name" placeholder="Название книги" required>
 
    <select class="s1" name="author_id">
         {% for author in authors %}
            <option value="{{ author.id }}">{{ author.name }}</option>
        {% endfor %}
    </select>
 
    <input class="i1" type="file" name="picture" required>
    <button class="b4">Сохранить</button>
</form>
