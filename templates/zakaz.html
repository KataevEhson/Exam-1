{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Библиотека</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <div class="div4">
             <a class="a2" href="/authors">Авторы</a>
            <a class="a2" href="/show_books">Книги</a>
            <a class="a2" href="/show_orders">Мои заказы</a>
        </div>
        <div class="div2 div5">
            <h2>{{ zakaz.cust_name }}</h2>
            <p>Книга: {{ zakaz.book.name }}</p>
            <p>Время возврата: {{ zakaz.time }}</p>
            <p>Дата добавления: {{ zakaz.created_at }}</p>
            <button class="b1"><a href="/show_orders">Назад</a></button>
            <button class="b2"><a href="/edit_order/{{ zakaz.id }}/">Изменить</a></button>
            <form method="post">
                {% csrf_token %}
                <button class="b3">Удалить</button>
            </form>
        </div>
    </body>
</html>
