{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Библиотека</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
     </head>
    <body>
        <div class="div4">
              <a class="a2" href="/authors">Авторы</a>
            <a class="a2" href="/show_books">Книги</a>
             <a class="a2" href="/show_orders">Мои заказы</a>
        </div>
        <div class="div2 div5">
            <h2>{{ avtor.name }}</h2>
              <p>Возраст: {{ avtor.age }}</p>
            <p>Дата добавления: {{ avtor.created_at }}</p>
             <button class="b1"><a href="/authors">Назад</a></button>
            <button class="b2"><a href="/edit_author/{{ avtor.id }}/">Изменить</a></button>
             <form method="post">
                {% csrf_token %}
                <button class="b3">Удалить</button>
            </form>
        </div>
    </body>
</html>
