{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Библиотека</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <div class="div4">
             <a class="a2" href="/authors">Авторы</a>
            <a class="a2" href="/show_books">Книги</a>
            <a class="a2" href="/show_orders">Мои заказы</a>
        </div>
        <div class="div2 div5">
            <form method="post">
                {% csrf_token %}
                <input class="i1" name="cust_name" value="{{ zakaz.cust_name }}" required>
                <select class="s1" name="book">
                    <option value="{{ zakaz.book_id }}">{{ zakaz.book.name }}</option>
                    {% for kniga in books %}
                        <option value="{{ kniga.id }}">{{ kniga.name }}</option>
                    {% endfor %}
                </select>
                <input class="i1" name="time" value="{{ zakaz.time }}" required>
                <button class="b2">Сохранить</button>
            </form>
            <button class="b1"><a href="/show_orders">Отмена</a></button>
        </div>
    </body>
</html>
