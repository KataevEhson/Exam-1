{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Библиотека</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <div class="div4">
             <a class="a2" href="/authors">Авторы</a>
            <a class="a2" href="/show_books">Книги</a>
            <a class="a2" href="/show_orders">Мои заказы</a>
        </div>
        <div class="div2 div5">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input class="i1" name="name" value="{{ kniga.name }}" required>
                <select class="s1" name="author_id">
                      <option value="{{ kniga.author_id }}">{{ kniga.author.name }}</option>
                    {% i in authors %}
                        <option value="{{ i.id }}">{{ i.name }}</option>
                    {% endfor %}
                </select>
                  <input class="i1" type="file" name="picture" accept="image/*">
                <button class="b2">Сохранить</button>
            </form>
            <button class="b1"><a href="/show_books">Отмена</a></button>
        </div>
    </body>
</html>
